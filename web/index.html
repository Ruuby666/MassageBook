<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reservar masaje a domicilio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>Reserva tu masaje</h1>
      <p class="subtitle">Servicio a domicilio. Completa tus datos y elige un horario.</p>

      <form id="booking-form" novalidate>
        <label>
          Nombre completo
          <input type="text" name="clientName" required autocomplete="name" />
        </label>

        <label>
          Teléfono
          <input type="tel" name="phone" required autocomplete="tel" />
        </label>

        <label>
          Correo (para tu recordatorio)
          <input type="email" name="email" required autocomplete="email" />
        </label>

        <label>
          Dirección y Codigo Postal (donde se realizará el masaje)
          <input type="text" name="address" required autocomplete="street-address" />
        </label>

        <div class="field-label">Elige tu masaje</div>
        <div class="service-list" id="service-list">
          <p class="service-loading" id="service-loading">Cargando masajes…</p>
        </div>
        <div class="service-details" id="service-details" hidden></div>

        <label>
          Fecha
          <input type="date" name="date" id="date-input" required />
        </label>
        <p class="field-hint" id="date-availability" hidden></p>

        <label>
          Hora
          <input type="time" name="time" id="time-input" min="08:00" max="21:00" required />
        </label>

        <label>
          Notas (opcional)
          <textarea name="notes" rows="3"></textarea>
        </label>

        <button type="submit" id="submit-button">Reservar</button>
        <p id="form-message" class="message" role="status"></p>
      </form>
    </main>

    <div class="modal-backdrop" id="review-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="review-modal-title">
        <h2 id="review-modal-title">Revisa tus datos antes de enviar la reserva</h2>
        <dl class="review-list" id="review-list"></dl>
        <div class="modal-actions">
          <button type="button" class="button-secondary" id="review-edit-button">Editar</button>
          <button type="button" class="button-primary" id="review-confirm-button">Confirmar reserva</button>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
